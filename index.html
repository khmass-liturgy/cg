<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교하성당 클래식기타반 · 초급 과정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f3; --paper:#ffffff;
  --ink:#211c14; --ink2:#5d564a; --ink3:#9b9485;
  --line:#e9e3d6; --line2:#d6cfc0;
  --wine:#7a2e2e; --wine-soft:#f6e9e7; --wine-line:#e0bdb8;
  --gold:#a07d20; --gold-soft:#f7efd6; --gold-line:#e3cf8e;
  --sage:#3a6b4f; --sage-soft:#e9f3ec; --sage-line:#aed3ba;
  --sky:#2c5d86; --sky-soft:#e8f1f8; --sky-line:#b6d2e6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.serif{font-family:'Noto Serif KR',serif}

/* ─── 헤더 ─── */
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.head-in{max-width:980px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand-mark{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9a4d2e,#7a2e2e);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(122,46,46,.25)}
.brand-mark svg{width:21px;height:21px;fill:#f7efd6}
.brand-txt h1{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--wine);letter-spacing:-.3px;line-height:1.2}
.brand-txt p{font-size:11.5px;color:var(--ink3);letter-spacing:.3px}
.head-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.prog-pill{font-size:12px;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:30px;padding:5px 13px;font-weight:500;white-space:nowrap}
.mgr-link{background:none;border:1px solid var(--line2);border-radius:9px;padding:7px 13px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:.15s;white-space:nowrap}
.mgr-link:hover{background:var(--wine-soft);border-color:var(--wine-line);color:var(--wine)}

/* ─── 메인 ─── */
main{max-width:980px;margin:0 auto;padding:26px 22px 60px}

/* 인트로 (홈) */
.intro{text-align:center;padding:18px 0 30px}
.intro-eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:600;margin-bottom:14px}
.intro h2{font-family:'Noto Serif KR',serif;font-size:30px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:14px}
.intro h2 em{color:var(--wine);font-style:normal}
.intro p{font-size:15px;color:var(--ink2);line-height:1.85;max-width:520px;margin:0 auto}

/* 과정 탭 */
.course-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px}
.course-tab{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;cursor:pointer;text-align:left;transition:.18s;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif}
.course-tab::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2);transition:.18s}
.course-tab:hover{border-color:var(--wine-line);transform:translateY(-2px);box-shadow:0 8px 22px rgba(122,46,46,.08)}
.course-tab.active{border-color:var(--wine);background:linear-gradient(180deg,var(--wine-soft),var(--paper))}
.course-tab.active::before{background:var(--wine)}
.ct-label{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:600;margin-bottom:7px}
.course-tab.active .ct-label{color:var(--wine)}
.ct-title{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:var(--ink);margin-bottom:4px}
.ct-sub{font-size:13px;color:var(--ink2)}
.ct-meta{display:flex;align-items:center;gap:10px;margin-top:12px}
.ct-bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.ct-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:3px;transition:width .4s}
.ct-count{font-size:12px;color:var(--ink3);font-weight:500;white-space:nowrap}

/* 레슨 그리드 */
.lessons-head{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.lessons-head .lh-title{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:var(--wine)}
.lessons-head .lh-sub{font-size:13px;color:var(--ink3)}
.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.ltile{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:15px 16px;cursor:pointer;transition:.16s;text-align:left;font-family:'Noto Sans KR',sans-serif;position:relative;display:flex;flex-direction:column;gap:8px;min-height:108px}
.ltile:hover{border-color:var(--gold-line);transform:translateY(-2px);box-shadow:0 7px 18px rgba(160,125,32,.1)}
.ltile-top{display:flex;align-items:center;justify-content:space-between}
.ltile-num{width:30px;height:30px;border-radius:9px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif}
.ltile.done .ltile-num{background:var(--sage-soft);color:var(--sage)}
.ltile-check{font-size:14px;color:var(--sage)}
.ltile-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
.ltile-desc{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:auto}

/* ─── 레슨 상세 ─── */
.detail-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back-btn{background:var(--paper);border:1px solid var(--line2);border-radius:9px;padding:7px 14px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:.15s}
.back-btn:hover{background:var(--wine-soft);border-color:var(--wine-line);color:var(--wine)}
.detail-crumb{font-size:13px;color:var(--ink3)}
.detail-crumb b{color:var(--wine);font-weight:600}

.dcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 16px rgba(33,28,20,.05)}
.dcard-head{padding:24px 28px;background:linear-gradient(135deg,var(--wine-soft),var(--paper));border-bottom:1px solid var(--wine-line)}
.dch-eyebrow{font-size:11.5px;letter-spacing:1.5px;color:var(--wine);font-weight:600;margin-bottom:6px}
.dch-title{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.3}
.dch-desc{font-size:14px;color:var(--ink2)}
.dcard-body{padding:26px 28px}

.blk{margin-bottom:26px}
.blk:last-child{margin-bottom:0}
.blk-label{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.blk-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.bi-sky{background:var(--sky-soft)}
.bi-gold{background:var(--gold-soft)}
.bi-sage{background:var(--sage-soft)}
.bi-wine{background:var(--wine-soft)}
.bi-gray{background:#f0ece4}
.blk-label-txt{font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:.8px}

.prose{font-size:15px;line-height:1.9;color:var(--ink)}
.prose b{color:var(--wine);font-weight:600}

.keypoints{display:flex;flex-direction:column;gap:9px}
.kp{display:flex;gap:11px;align-items:flex-start;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:11px 15px}
.kp-n{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.kp-t{font-size:14px;color:var(--ink);line-height:1.6}

.scorewrap{background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:12px;padding:17px}
.score-mono{font-family:'Noto Sans KR',monospace;font-size:13.5px;background:var(--paper);border:1px solid var(--sage-line);border-radius:9px;padding:15px 17px;white-space:pre;line-height:1.85;color:#1d4631;overflow-x:auto;margin-bottom:11px}
.score-cap{font-size:13px;color:var(--sage);text-align:center}
.gd-slot{background:var(--paper);border:2px dashed var(--sage-line);border-radius:10px;min-height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:11px}
.gd-slot iframe{width:100%;height:360px;border:none;border-radius:7px}
.gd-empty{text-align:center;color:var(--sage);opacity:.65;padding:24px}
.gd-empty p{font-size:13px;margin-top:7px}
.gd-row{display:flex;gap:8px;flex-wrap:wrap}
.gd-input{flex:1;min-width:210px;border:1px solid var(--line2);border-radius:8px;padding:9px 12px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper)}
.gd-input:focus{outline:none;border-color:var(--sage)}
.gd-save{background:var(--sage);color:#fff;border:none;border-radius:8px;padding:9px 17px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.gd-save:hover{background:#2f5740}
.gd-del{background:var(--wine-soft);color:var(--wine);border:1px solid var(--wine-line);border-radius:8px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}

.vids{display:flex;flex-direction:column;gap:9px}
.vid{display:flex;align-items:center;gap:13px;background:var(--wine-soft);border:1px solid var(--wine-line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s}
.vid:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(122,46,46,.12);background:#f4e2df}
.vid-play{width:46px;height:34px;background:var(--wine);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.vid-meta{flex:1;min-width:0}
.vid-t{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-c{font-size:12px;color:var(--ink3);margin-top:1px}
.vid-badge{font-size:11.5px;color:var(--wine);background:var(--paper);border:1px solid var(--wine-line);border-radius:30px;padding:4px 10px;white-space:nowrap;flex-shrink:0;font-weight:500}
.vid-note{font-size:12px;color:var(--ink3);margin-top:8px;text-align:center}

.practice{background:#f5f1ea;border:1px solid var(--line);border-radius:12px;padding:15px 18px}
.pr{display:flex;gap:11px;align-items:flex-start;padding:5px 0;font-size:14px;color:var(--ink);line-height:1.6}
.pr-n{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--gold);font-weight:700;flex-shrink:0;min-width:18px}

.dcard-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;border-top:1px solid var(--line);background:#faf8f3;flex-wrap:wrap}
.done-btn{display:flex;align-items:center;gap:7px;background:var(--sage);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:.15s}
.done-btn:hover{background:#2f5740}
.done-btn.is-done{background:#9b9485;cursor:default}
.next-btn{display:flex;align-items:center;gap:6px;background:var(--wine-soft);color:var(--wine);border:1px solid var(--wine-line);border-radius:10px;padding:11px 19px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:.15s}
.next-btn:hover{background:#f4e2df}

/* ─── 강좌 관리 ─── */
.mgr-wrap{max-width:680px;margin:0 auto}
.mgr-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.mgr-top h2{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:var(--wine);flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:15px}
.card-t{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.card.ok{background:var(--sage-soft);border-color:var(--sage-line)}
.url-mono{font-size:11.5px;color:var(--ink3);word-break:break-all;font-family:monospace;margin:4px 0 9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.in{flex:1;min-width:210px;border:1px solid var(--line2);border-radius:8px;padding:9px 12px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg)}
.in.mono{font-family:monospace}
.in:focus{outline:none;border-color:var(--gold)}
.b-gold{background:var(--gold);color:#fff;border:none;border-radius:8px;padding:9px 17px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.b-gold:hover{background:#876a1a}
.b-sage{background:var(--sage);color:#fff;border:none;border-radius:8px;padding:9px 17px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.b-sage:hover{background:#2f5740}
.b-ghost{background:none;border:1px solid var(--line2);border-radius:8px;padding:8px 13px;font-size:13px;color:var(--ink3);cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.b-ghost:hover{color:var(--wine);border-color:var(--wine-line)}
.msg{font-size:12.5px;margin-top:7px}
.msg.ok{color:var(--sage)}
.msg.err{color:var(--wine)}
.sel-card label{font-size:13px;font-weight:500;color:var(--ink2);display:block;margin-bottom:7px}
.sel-card select{width:100%;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper);cursor:pointer}
.sel-card select:focus{outline:none;border-color:var(--gold)}
.vbox-t{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.vrow{display:flex;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px}
.vrow-info{flex:1;min-width:0}
.vrow-t{font-size:13.5px;font-weight:500;color:var(--ink)}
.vrow-s{font-size:12px;color:var(--ink3);margin-top:2px;word-break:break-all}
.vrow-act{display:flex;gap:5px;flex-shrink:0}
.b-edit{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line);border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.b-del{background:var(--wine-soft);color:var(--wine);border:1px solid var(--wine-line);border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.addform{background:var(--sky-soft);border:1px solid var(--sky-line);border-radius:11px;padding:15px 17px;margin-top:4px}
.addform-t{font-size:13px;font-weight:600;color:var(--sky);margin-bottom:11px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ffield{display:flex;flex-direction:column;gap:4px}
.ffield.full{grid-column:1/-1}
.ffield label{font-size:12px;font-weight:500;color:var(--ink2)}
.ffield input{border:1px solid var(--line2);border-radius:7px;padding:8px 11px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper)}
.ffield input:focus{outline:none;border-color:var(--gold)}
.fact{display:flex;gap:8px;margin-top:11px;align-items:center}
.b-add{background:var(--sage-soft);color:var(--sage);border:1px solid var(--sage-line);border-radius:8px;padding:8px 15px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.vempty{text-align:center;padding:16px;color:var(--ink3);font-size:13.5px;background:var(--bg);border-radius:9px;border:1px dashed var(--line2)}
.hint-box{background:var(--sky-soft);border:1px solid var(--sky-line);border-radius:10px;padding:13px 16px;font-size:13px;color:var(--ink2);line-height:1.7}
.hint-box b{color:var(--sky)}
.hint-box a{color:var(--sky)}

@media(max-width:720px){
  .course-tabs{grid-template-columns:1fr}
  .lesson-grid{grid-template-columns:1fr 1fr}
  .intro h2{font-size:24px}
  main{padding:18px 16px 50px}
}
@media(max-width:460px){
  .lesson-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand" onclick="goHome()">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm-1.2-12.3v5.1a2.5 2.5 0 101.6 2.3V8.5l3.1-1V6l-4.7 1.7z"/></svg>
      </div>
      <div class="brand-txt">
        <h1>교하성당 클래식기타반</h1>
        <p>초급 과정 · 초급Ⅰ &amp; 초급Ⅱ</p>
      </div>
    </div>
    <div class="head-right">
      <span class="prog-pill" id="progPill">진도 0 / 24</span>
      <button class="mgr-link" onclick="showMgr()">⚙ 강좌 관리</button>
    </div>
  </div>
</header>

<main>
  <div id="home"></div>
  <div id="detail" style="display:none"></div>
  <div id="mgr" style="display:none"></div>
</main>

<script>
/*%%CUR_START%%*/
const CUR=[
{id:'c1',title:'초급 Ⅰ',label:'COURSE I',sub:'기초 다지기 · 12강',
 playlist:{title:'클래식기타 왕초보 👉초급Ⅰ (12강)',channel:'클래식기타 왕초보',url:'https://www.youtube.com/playlist?list=PL_lrBTRQtglABz2gQpaq_2BGZTCUVB8rM',dur:'재생목록'},
 lessons:[
  {id:'c1l1',title:'기타 구조와 명칭',desc:'헤드·넥·바디와 6개 줄을 익혀요',
   explain:'<b>클래식 기타</b>는 나일론 줄을 손가락으로 연주하는 악기입니다. 먼저 악기와 친해지는 것부터 시작합니다.\n\n기타는 <b>헤드</b>(줄감개), <b>넥</b>(지판), <b>바디</b>(소리통)로 이뤄집니다. 줄은 가장 굵은 것이 <b>6번줄</b>, 가장 얇은 것이 <b>1번줄</b>입니다.',
   points:['헤드 — 줄을 감아 음높이를 조절하는 부분','넥 — 프렛이 있는 긴 지판','바디 — 소리가 울리는 통','6번(굵음) → 1번(얇음) 순서로 줄 번호'],
   score:null,scoreCaption:'',videos:[],
   practice:['기타 각 부위를 손으로 짚으며 이름 말하기','6번줄부터 1번줄까지 차례로 퉁겨 소리 듣기','오늘은 악기와 친해지는 것이 목표']},
  {id:'c1l2',title:'바른 연주 자세',desc:'발받침과 기타 거치 위치를 잡아요',
   explain:'좋은 소리와 부상 예방은 <b>바른 자세</b>에서 시작됩니다.\n\n<b>발받침</b>으로 왼발을 올리고, 기타의 잘록한 허리를 왼 무릎에 얹습니다. 허리는 곧게 펴고 넥은 약 45도로 위를 향합니다.',

// ── Gist 연동 ──
const GIST_FILE='guitar_curriculum.json';
// ↓ 이 Gist ID로 모든 기기가 자동 동기화됩니다
const DEFAULT_GIST_ID='b11c81ea15d2111b81bfaa22018fb258';
let gistId=localStorage.getItem('kg_gist_id')||DEFAULT_GIST_ID;
let gistToken=localStorage.getItem('kg_gist_token')||'';
let gistBusy=false;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function gistLoad(){
  const loadId=gistId||DEFAULT_GIST_ID;
  if(!loadId)return;
  try{
    const r=await fetch('https://api.github.com/gists/'+loadId,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok)return;
    const d=await r.json();
    const f=d.files&&d.files[GIST_FILE];
    if(!f||!f.content)return;
    const j=JSON.parse(f.content);
    // 영상
    if(j.videos)Object.entries(j.videos).forEach(([lid,v])=>{const l=allLessons().find(x=>x.id===lid);if(l)l.videos=v;});
    // 악보
    if(j.scores)Object.entries(j.scores).forEach(([lid,u])=>{const l=allLessons().find(x=>x.id===lid);if(l)l._gd=u;});
    // 강의명
    if(j.titles)Object.entries(j.titles).forEach(([lid,t])=>{const l=allLessons().find(x=>x.id===lid);if(l)l.title=t;});
    // 추가 과정 복원 (기존에 없는 것만)
    if(j.extraCourses&&Array.isArray(j.extraCourses)){
      j.extraCourses.forEach(ec=>{
        if(!CUR.find(c=>c.id===ec.id)){
          CUR.push({
            id:ec.id,title:ec.title,label:ec.label||'',sub:ec.sub||'',
            playlist:{title:ec.title,channel:'',url:'',dur:'재생목록'},
            lessons:(ec.lessons||[]).map(l=>({
              id:l.id,title:l.title,desc:'',
              explain:'선생님이 내용을 추가해 주세요.',
              points:['내용을 입력해 주세요'],
              score:null,scoreCaption:'',videos:[],practice:['연습 내용을 입력해 주세요']
            }))
          });
        }
      });
    }
  }catch(e){}
}

async function gistSave(){
  if(!gistToken){alert('토큰을 먼저 입력해 주세요.');return;}
  if(gistBusy)return;
  // 저장할 Gist ID — 항상 고정 ID 사용 (절대 새로 생성하지 않음)
  const targetId=gistId||DEFAULT_GIST_ID;
  if(!targetId){alert('Gist ID가 설정되지 않았습니다.\nHTML 소스를 확인해 주세요.');return;}
  gistBusy=true;renderMgr();
  try{
    const videos={},scores={},titles={};
    allLessons().forEach(l=>{
      if(l.videos&&l.videos.length)videos[l.id]=l.videos;
      if(l._gd)scores[l.id]=l._gd;
      titles[l.id]=l.title;
    });
    const extraCourses=CUR.length>2?CUR.slice(2).map(c=>({
      id:c.id,title:c.title,label:c.label||'',sub:c.sub||'',
      lessons:c.lessons.map(l=>({id:l.id,title:l.title}))
    })):[];
    const content=JSON.stringify({videos,scores,titles,extraCourses},null,2);
    const body={description:'교하성당 클래식기타반 강좌 데이터',public:false,files:{[GIST_FILE]:{content}}};
    // 항상 PATCH (기존 Gist 업데이트) — POST(신규 생성) 절대 안 함
    const r=await fetch('https://api.github.com/gists/'+targetId,{
      method:'PATCH',
      headers:{'Authorization':'token '+gistToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!r.ok){
      const msg=r.status===404?'Gist를 찾을 수 없습니다. Gist ID를 확인해 주세요.'
               :r.status===403||r.status===401?'토큰 권한이 없습니다. gist scope를 확인해 주세요.'
               :'저장 실패('+r.status+')';
      throw new Error(msg);
    }
    // ID는 항상 동일한 값 유지 (변경하지 않음)
    localStorage.setItem('kg_gist_token',gistToken);
    alert('✓ Gist에 저장됐습니다!\n모든 회원이 새로고침하면 최신 내용이 보입니다.');
  }catch(e){alert('저장 실패: '+e.message);}
  finally{gistBusy=false;renderMgr();}
}

// ── 소스 내보내기 (Gist ID가 심어진 파일 다운로드) ──
function exportHtml(){
  // 현재 스크립트 소스에서 DEFAULT_GIST_ID 교체
  const scripts=document.querySelectorAll('script');
  let src='';
  for(const s of scripts){
    if(!s.src&&s.textContent.includes('DEFAULT_GIST_ID')){src=s.textContent;break;}
  }
  if(!src){alert('소스를 찾을 수 없습니다.');return;}
  // DEFAULT_GIST_ID 값을 현재 gistId로 교체
  const newSrc=src.replace(/const DEFAULT_GIST_ID='[^']*'/,`const DEFAULT_GIST_ID='${gistId}'`);
  const fullHtml=document.documentElement.outerHTML.replace(src,newSrc);
  const blob=new Blob([fullHtml],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='guitar_app.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  alert('✓ 다운로드 완료!\nguitarapp.html을 GitHub Pages(cg 폴더)에 업로드하면\n모든 회원이 자동으로 최신 강좌를 보게 됩니다.');
}

function connectGistIdOnly(){
  const id=document.getElementById('gid-direct')?.value.trim()||'';
  if(!id||id.length<10){
    const err=document.getElementById('gerr');
    if(err)err.textContent='올바른 Gist ID를 입력해 주세요.';
    return;
  }
  gistId=id;
  localStorage.setItem('kg_gist_id',gistId);
  renderMgr();
  // 바로 데이터 로드
  gistLoad().then(()=>{if(curLesson)renderDetail(curLesson);else renderHome();});
}

async function connectGist(){
  const t=document.getElementById('gtok')?.value.trim()||'';
  const err=document.getElementById('gerr');
  if(!t){if(err)err.textContent='토큰을 입력해 주세요.';return;}
  if(err)err.textContent='확인 중...';
  try{
    const r=await fetch('https://api.github.com/user',{headers:{'Authorization':'token '+t,'Accept':'application/vnd.github+json'}});
    if(!r.ok)throw new Error('토큰이 유효하지 않습니다.');
    gistToken=t;
    localStorage.setItem('kg_gist_token',gistToken);
    if(err)err.textContent='';
    renderMgr(); // 연결 상태만 표시, 저장은 선생님이 직접 버튼 클릭
  }catch(e){if(err)err.textContent='✗ '+e.message;}
}

function disconnectGist(){
  if(!confirm('Gist 연동을 해제할까요?\n(읽기는 계속 유지됩니다. 저장 토큰만 해제됩니다)'))return;
  gistToken='';
  localStorage.removeItem('kg_gist_token');
  // gistId는 DEFAULT_GIST_ID 유지 — 회원 읽기용은 계속 작동
  renderMgr();
}

          ${isDone?'✓ 완료한 강의':'✓ 이 강의 완료'}
        </button>
        ${next?`<button class="next-btn" data-lid="${next}" onclick="openLesson(this.dataset.lid)">다음 강의 →</button>`:`<span style="font-size:14px;color:var(--sage);font-weight:600">🎉 과정 완료!</span>`}
      </div>
    </div>`;
}

function markDone(lid){
  done.add(lid);saveDone();
  if(curLesson&&curLesson.id===lid)renderDetail(curLesson);
}

// 구글드라이브
function gdEmbed(u){
  if(!u)return'';
  if(u.includes('/preview'))return u;
  let m=u.match(/\/file\/d\/([^\/?]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;
  m=u.match(/[?&]id=([^&]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;
  return'';
}
function saveGd(lid){
  const inp=document.getElementById('gdin_'+lid);const u=inp?inp.value.trim():'';
  if(!u){alert('링크를 입력해 주세요.');return;}
  const l=allLessons().find(x=>x.id===lid);if(l)l._gd=u;
  if(curLesson&&curLesson.id===lid)renderDetail(curLesson);
}
function delGd(lid){
  if(!confirm('악보 링크를 삭제할까요?'))return;
  const l=allLessons().find(x=>x.id===lid);if(l)delete l._gd;
  if(curLesson&&curLesson.id===lid)renderDetail(curLesson);
}

// ── 강좌 관리 ──
function showMgr(){
  mgrLid=mgrLid||CUR[0].lessons[0].id;
  mgrEdit=null; mgrTab='video';
  document.getElementById('home').style.display='none';
  document.getElementById('detail').style.display='none';
  document.getElementById('mgr').style.display='block';
  renderMgr(); window.scrollTo(0,0);
}
function hideMgr(){
  if(curLesson)openLesson(curLesson.id);else goHome();
}
function switchTab(t){ mgrTab=t; mgrEdit=null; renderMgr(); }

function renderMgr(){
  const lesson=allLessons().find(l=>l.id===mgrLid);
  const vids=lesson?lesson.videos||[]:[];

  // Gist 카드
  const gistCard=gistId
    ?`<div class="card ok">
        <div class="card-t">☁ Gist 연동됨 <span style="font-size:11px;color:var(--ink3)">${gistId.slice(0,8)}…</span></div>
        <div class="url-mono">https://gist.github.com/${gistId}</div>
        <div class="row">
          <button class="b-sage" onclick="gistSave()" ${gistBusy?'disabled':''}>${gistBusy?'저장 중…':'☁ Gist에 저장'}</button>
          <button class="b-gold" onclick="exportHtml()">⬇ 소스 내보내기</button>
          <a href="https://gist.github.com/${gistId}" target="_blank" style="font-size:12.5px;color:var(--sky)">원본 ↗</a>
          <button class="b-ghost" onclick="disconnectGist()">연결 해제</button>
        </div>
        <div style="font-size:12px;color:var(--sage);margin-top:8px;line-height:1.6">
          💡 수정 후 <b>Gist에 저장</b>하면 모든 회원에게 자동 반영됩니다
        </div>
      </div>`
    :`<div class="card">
        <div class="card-t">☁ Gist 연동 설정</div>
        <div class="hint-box">강좌를 저장하면 <b>모든 회원 화면에 자동 반영</b>됩니다.<br>
          <a href="https://github.com/settings/tokens/new?scopes=gist" target="_blank">토큰 발급 ↗</a> (scope: <b>gist</b> 체크)
        </div>
        <div class="row">
          <input class="in mono" id="gtok" type="password" placeholder="ghp_ 토큰">
          <button class="b-gold" onclick="connectGist()">연결</button>
        </div>
        <div id="gerr" class="msg err"></div>
      </div>`;

  // 탭 메뉴
  const tabs=`
    <div style="display:flex;gap:0;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden">
      ${[['video','▶ 영상 관리'],['rename','✏ 강의명 수정'],['course','＋ 과정 관리']].map(([t,label])=>`
        <button onclick="switchTab('${t}')" style="flex:1;padding:10px;font-size:13.5px;font-weight:${mgrTab===t?'600':'400'};
          background:${mgrTab===t?'var(--wine)':'var(--paper)'};
          color:${mgrTab===t?'#fff':'var(--ink2)'};
          border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:.15s">
          ${label}
        </button>`).join('')}
    </div>`;

  // ── 탭 1: 영상 관리 ──
  const opts=CUR.map(c=>`<optgroup label="${c.title}">`
    +c.lessons.map(l=>`<option value="${l.id}"${l.id===mgrLid?' selected':''}>${l.title}</option>`).join('')
    +`</optgroup>`).join('');

  const vlist=vids.length
    ?vids.map((v,i)=>`<div class="vrow">
        <div class="vrow-info">
          <div class="vrow-t">${esc(v.title)}</div>
          <div class="vrow-s">${esc(v.channel||'')}${v.dur?' · '+esc(v.dur):''}<br>
            <span style="color:var(--sky)">${esc(v.url)}</span>
          </div>
        </div>
        <div class="vrow-act">
          <button class="b-edit" data-i="${i}" onclick="mEdit(+this.dataset.i)">수정</button>
          <button class="b-del" data-i="${i}" onclick="mDel(+this.dataset.i)">삭제</button>
        </div>
      </div>`).join('')
    :`<div class="vempty">등록된 영상이 없습니다<br><small>해당 과정의 재생목록이 기본 표시됩니다</small></div>`;

  let vform='';
  if(mgrEdit!==null){
    const isNew=mgrEdit===-1; const v=isNew?{}:(vids[mgrEdit]||{});
    vform=`<div class="addform">
      <div class="addform-t">${isNew?'＋ 새 영상 추가':'✦ 영상 수정'}</div>
      <div class="fgrid">
        <div class="ffield full"><label>영상 제목 *</label><input id="mt" value="${esc(v.title||'')}" placeholder="예: 1강 기타 구조 강의"></div>
        <div class="ffield"><label>채널명</label><input id="mc" value="${esc(v.channel||'')}" placeholder="예: 클래식기타 왕초보"></div>
        <div class="ffield"><label>재생 시간</label><input id="md" value="${esc(v.dur||'')}" placeholder="예: 12분"></div>
        <div class="ffield full"><label>유튜브 URL *</label><input id="mu" value="${esc(v.url||'')}" placeholder="https://www.youtube.com/watch?v=..."></div>
      </div>
      <div class="fact">
        <button class="b-gold" onclick="mSave()">저장</button>
        <button class="b-ghost" onclick="mCancel()">취소</button>
        <span id="merr" class="msg err"></span>
      </div>
    </div>`;
  }

  const tabVideo=`
    <div class="card sel-card"><label>강의 선택</label>
      <select onchange="mChange(this.value)">${opts}</select>
    </div>
    <div class="card">
      <div class="vbox-t">
        <span>등록된 영상 <span style="color:var(--gold)">(${vids.length}개)</span></span>
        ${mgrEdit===null?`<button class="b-add" onclick="mAdd()">＋ 영상 추가</button>`:''}
      </div>
      ${vlist}${vform}
    </div>`;

  // ── 탭 2: 강의명 수정 ──
  const tabRename=`
    <div class="card">
      <div class="card-t" style="margin-bottom:14px">✏ 과정별 강의명 수정</div>
      ${CUR.map(c=>`
        <div style="margin-bottom:18px">
          <div style="font-size:13px;font-weight:600;color:var(--wine);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)">
            ${esc(c.title)}
          </div>
          ${c.lessons.map(l=>`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
              <span style="font-size:12px;color:var(--ink3);width:36px;flex-shrink:0;text-align:right">${l.id.replace(/[a-z]+/,'')}</span>
              <input class="in" style="flex:1;padding:7px 10px;font-size:13.5px"
                id="rn_${l.id}" value="${esc(l.title)}"
                onblur="saveRename('${l.id}',this.value)">
            </div>`).join('')}
        </div>`).join('')}
      <div style="font-size:12.5px;color:var(--ink3)">※ 입력칸에서 나가면 자동 저장됩니다 · Gist에 저장해야 회원 반영</div>
    </div>`;

  // ── 탭 3: 과정 관리 ──
  const courseList=CUR.map((c,ci)=>`
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:13px;font-weight:600;color:var(--wine);flex:1">${esc(c.title)}</span>
        <span style="font-size:12px;color:var(--ink3)">${c.lessons.length}강</span>
        ${CUR.length>1?`<button class="b-del" style="font-size:12px;padding:4px 10px"
          data-ci="${ci}" onclick="deleteCourse(+this.dataset.ci)">과정 삭제</button>`:''}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:12.5px;color:var(--ink2)">강의 추가:</span>
        <input class="in" id="new_lesson_${c.id}" style="flex:1;padding:7px 10px;font-size:13.5px" placeholder="새 강의 제목">
        <button class="b-sage" style="padding:7px 13px;font-size:13px"
          data-cid="${c.id}" onclick="addLesson(this.dataset.cid)">추가</button>
      </div>
    </div>`).join('');

  const tabCourse=`
    <div class="card">
      <div class="card-t" style="margin-bottom:14px">현재 과정 목록</div>
      ${courseList}
    </div>
    <div class="card" style="border:1.5px dashed var(--gold-line);background:var(--gold-soft)">
      <div class="card-t" style="margin-bottom:12px">＋ 새 과정 추가</div>
      <div class="fgrid" style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px">
        <div class="ffield full">
          <label>과정 이름 *</label>
          <input class="in" id="nc-title" placeholder="예: 중급 Ⅰ">
        </div>
        <div class="ffield">
          <label>라벨 (영문)</label>
          <input class="in" id="nc-label" placeholder="예: COURSE III">
        </div>
        <div class="ffield">
          <label>부제</label>
          <input class="in" id="nc-sub" placeholder="예: 중급 기초 · 12강">
        </div>
        <div class="ffield full">
          <label>첫 번째 강의 제목 *</label>
          <input class="in" id="nc-lesson" placeholder="예: 바레 코드 입문">
        </div>
      </div>
      <div class="fact">
        <button class="b-gold" onclick="addCourse()">＋ 과정 추가</button>
        <span id="course-err" class="msg err"></span>
      </div>
    </div>`;

  document.getElementById('mgr').innerHTML=`
    <div class="mgr-wrap">
      <div class="mgr-top">
        <button class="back-btn" onclick="hideMgr()">← 돌아가기</button>
        <h2>강좌 관리</h2>
      </div>
      ${gistCard}
      ${tabs}
      ${mgrTab==='video'?tabVideo:mgrTab==='rename'?tabRename:tabCourse}
    </div>`;
}

function mChange(lid){mgrLid=lid;mgrEdit=null;renderMgr();}
function mAdd(){mgrEdit=-1;renderMgr();}
function mEdit(i){mgrEdit=i;renderMgr();}
function mCancel(){mgrEdit=null;renderMgr();}
function mSave(){
  const t=document.getElementById('mt')?.value.trim()||'';
  const u=document.getElementById('mu')?.value.trim()||'';
  const c=document.getElementById('mc')?.value.trim()||'';
  const d=document.getElementById('md')?.value.trim()||'';
  const err=document.getElementById('merr');
  if(!t){if(err)err.textContent='제목을 입력해 주세요.';return;}
  if(!u||!u.startsWith('http')){if(err)err.textContent='올바른 URL을 입력해 주세요.';return;}
  const l=allLessons().find(x=>x.id===mgrLid);if(!l)return;
  if(!l.videos)l.videos=[];
  const v={title:t,channel:c,url:u,dur:d};
  if(mgrEdit===-1)l.videos.push(v);else l.videos[mgrEdit]=v;
  mgrEdit=null;renderMgr();
}
function mDel(i){
  if(!confirm('이 영상을 삭제할까요?'))return;
  const l=allLessons().find(x=>x.id===mgrLid);
  if(l&&l.videos)l.videos.splice(i,1);
  mgrEdit=null;renderMgr();
}

// ── 강의명 수정 ──
function saveRename(lid, val){
  const title=val.trim();
  if(!title)return;
  const l=allLessons().find(x=>x.id===lid);
  if(l&&l.title!==title){
    l.title=title;
    // 홈·사이드바도 갱신
    renderHome();
  }
}

// ── 과정 추가 / 강의 추가 / 과정 삭제 ──
function addCourse(){
  const title=document.getElementById('nc-title')?.value.trim()||'';
  const label=document.getElementById('nc-label')?.value.trim()||'';
  const sub=document.getElementById('nc-sub')?.value.trim()||'';
  const lesson=document.getElementById('nc-lesson')?.value.trim()||'';
  const err=document.getElementById('course-err');
  if(!title){if(err)err.textContent='과정 이름을 입력해 주세요.';return;}
  if(!lesson){if(err)err.textContent='첫 번째 강의 제목을 입력해 주세요.';return;}
  const ci=CUR.length+1;
  const newId='c'+ci;
  const newLid=newId+'l1';
  CUR.push({
    id:newId,
    title,
    label:label||'COURSE '+ci,
    sub:sub||title+' · 강의',
    playlist:{title,channel:'',url:'',dur:'재생목록'},
    lessons:[{
      id:newLid,title:lesson,desc:'',
      explain:'선생님이 내용을 추가해 주세요.',
      points:['내용을 입력해 주세요'],
      score:null,scoreCaption:'',videos:[],practice:['연습 내용을 입력해 주세요']
    }]
  });
  mgrLid=newLid;
  if(err)err.textContent='';
  renderMgr();
  renderHome();
  alert(`✓ "${title}" 과정이 추가됐습니다!\n강의명 수정 탭에서 내용을 채워주세요.`);
}

function addLesson(cid){
  const inp=document.getElementById('new_lesson_'+cid);
  const title=inp?inp.value.trim():'';
  if(!title){alert('강의 제목을 입력해 주세요.');return;}
  const course=CUR.find(c=>c.id===cid);
  if(!course)return;
  const newLid=cid+'l'+(course.lessons.length+1);
  course.lessons.push({
    id:newLid,title,desc:'',
    explain:'선생님이 내용을 추가해 주세요.',
    points:['내용을 입력해 주세요'],
    score:null,scoreCaption:'',videos:[],practice:['연습 내용을 입력해 주세요']
  });
  mgrLid=newLid;
  renderMgr();
  renderHome();
}

function deleteCourse(ci){
  const course=CUR[ci];
  if(!course)return;
  if(!confirm(`"${course.title}" 과정 전체를 삭제할까요?\n${course.lessons.length}개 강의가 모두 삭제됩니다.`))return;
  CUR.splice(ci,1);
  mgrLid=CUR[0]?.lessons[0]?.id||null;
  renderMgr();
  renderHome();
}

// ── 초기화 ──
async function init(){
  renderHome();
  // Gist에서 최신 강좌 데이터 자동 로드 (모든 기기 공통)
  await gistLoad();
  renderHome();
}
init();
</script>
</body>
</html>
