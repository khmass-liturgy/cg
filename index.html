<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교하성당 클래식기타반</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6f1;--surface:#fff;--surface2:#f2efe8;--border:#e0dbd0;--border2:#ccc7b8;--accent:#8b6914;--accent-light:#f5edd8;--accent-mid:#c49a2a;--text:#1a1810;--text2:#5a5448;--text3:#9a9080;--green:#2d6a4f;--green-bg:#e8f5ee;--blue:#1a4a7a;--blue-bg:#e8f0f8;--red:#8b2020;--red-bg:#faeaea}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;font-size:14px}
#header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.hdr-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent-mid));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--accent)}
.hdr-sub{font-size:11px;color:var(--text3);margin-left:2px}
.hdr-right{margin-left:auto}
.progress-pill{background:var(--accent-light);border:1px solid #e0c87a;border-radius:20px;padding:4px 12px;font-size:11.5px;color:var(--accent);font-weight:500}
#layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)}
#sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
.sidebar-section{border-bottom:1px solid var(--border)}
.stage-header{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s;user-select:none}
.stage-header:hover{background:var(--surface2)}
.stage-header.open{background:var(--accent-light)}
.stage-badge{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text2);flex-shrink:0}
.stage-header.open .stage-badge{background:var(--accent);border-color:var(--accent);color:#fff}
.stage-name{font-size:12.5px;font-weight:500;color:var(--text);flex:1;line-height:1.3}
.stage-arrow{font-size:10px;color:var(--text3);transition:transform .2s}
.stage-header.open .stage-arrow{transform:rotate(90deg)}
.lesson-list{display:none;flex-direction:column}
.lesson-list.open{display:flex}
.lesson-item{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 30px;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.lesson-item:hover{background:var(--surface2)}
.lesson-item.active{background:var(--accent-light);border-left-color:var(--accent)}
.lesson-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0}
.lesson-item.active .lesson-dot{background:var(--accent)}
.lesson-item.done .lesson-dot{background:var(--green)}
.lesson-item-text{font-size:12px;color:var(--text2);line-height:1.4;flex:1}
.lesson-item.active .lesson-item-text{color:var(--accent);font-weight:500}
.done-check{font-size:11px;color:var(--green)}
#main{padding:28px 32px;overflow-y:auto;max-width:800px}
.lesson-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.lesson-card-header{background:linear-gradient(135deg,var(--accent-light),#fdf8ec);border-bottom:1px solid var(--border);padding:18px 22px}
.lesson-card-stage{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.lesson-card-title{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.lesson-card-desc{font-size:13px;color:var(--text2)}
.lesson-card-body{padding:22px}
.section-block{margin-bottom:20px}
.section-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.sicon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px}
.si-blue{background:var(--blue-bg)}
.si-gold{background:var(--accent-light)}
.si-green{background:var(--green-bg)}
.si-red{background:var(--red-bg)}
.si-gray{background:var(--surface2)}
.explain-text{font-size:13.5px;line-height:1.85;color:var(--text)}
.explain-text b{color:var(--accent);font-weight:600}
.point-list{display:flex;flex-direction:column;gap:8px}
.point-item{display:flex;gap:10px;align-items:flex-start;background:var(--accent-light);border:1px solid #e8d88a;border-radius:8px;padding:10px 13px}
.point-num{width:20px;height:20px;background:var(--accent);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.point-text{font-size:13px;line-height:1.6;color:var(--text)}
.score-area{background:var(--green-bg);border:1px solid #a8d5b8;border-radius:10px;overflow:hidden}
.score-area-inner{padding:16px 18px}
.score-img-slot{background:#fff;border:2px dashed #a8d5b8;border-radius:8px;min-height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.score-img-slot img{max-width:100%;max-height:240px;display:block;border-radius:6px}
.score-placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--green);opacity:.6}
.score-placeholder span{font-size:11px;text-align:center}
.score-ascii{font-family:monospace;font-size:12.5px;background:#fff;padding:14px 16px;border-radius:8px;border:1px solid #a8d5b8;white-space:pre;line-height:1.8;color:#1a4a30;overflow-x:auto;margin-bottom:12px}
.score-caption{font-size:12px;color:var(--green);text-align:center}
.video-list{display:flex;flex-direction:column;gap:10px}
.video-item{display:flex;align-items:center;gap:12px;background:#fff5f5;border:1px solid #f0b8b8;border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;text-decoration:none}
.video-item:hover{background:#ffe8e8;border-color:var(--red);transform:translateY(-1px);box-shadow:0 3px 10px rgba(139,32,32,.1)}
.video-thumb{width:48px;height:34px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:#fff}
.video-info{flex:1}
.video-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;line-height:1.4}
.video-channel{font-size:11px;color:var(--text3)}
.video-badge{font-size:10px;background:var(--red-bg);color:var(--red);border:1px solid #f0b8b8;border-radius:10px;padding:2px 8px;white-space:nowrap}
.practice-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.practice-steps{display:flex;flex-direction:column;gap:7px}
.practice-step{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;color:var(--text)}
.step-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.lesson-footer{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:1px solid var(--border);background:var(--surface2)}
.btn-done{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.btn-done:hover{background:#236040;transform:translateY(-1px)}
.btn-done.done{background:#888;cursor:default}
.btn-next{display:flex;align-items:center;gap:6px;background:var(--accent-light);color:var(--accent);border:1px solid #e0c87a;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.btn-next:hover{background:#eedfa0}
#welcome{padding:40px 0;text-align:center}
.welcome-icon{font-size:56px;margin-bottom:16px}
.welcome-title{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:700;color:var(--accent);margin-bottom:8px}
.welcome-sub{font-size:15px;color:var(--text2);line-height:1.7;margin-bottom:28px}
.welcome-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.welcome-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:left}
.wc-num{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px}
.wc-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.wc-desc{font-size:11.5px;color:var(--text3);line-height:1.5}
.btn-start{background:linear-gradient(135deg,var(--accent),var(--accent-mid));color:#fff;border:none;border-radius:10px;padding:14px 36px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Noto Serif KR',serif;transition:all .2s;box-shadow:0 4px 16px rgba(139,105,20,.3)}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(139,105,20,.4)}
@media(max-width:680px){#layout{grid-template-columns:1fr}#sidebar{display:none}#main{padding:16px}.welcome-cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="header">
  <div class="hdr-logo">
    <div class="hdr-icon">🎸</div>
    <div>
      <div class="hdr-title">교하성당 클래식기타반</div>
      <div class="hdr-sub">초급 과정 교육 시스템</div>
    </div>
  </div>
  <div class="hdr-right"><div class="progress-pill" id="ppill">진도: 0 / 0 레슨</div></div>
</div>
<div id="layout">
  <div id="sidebar"><div id="stage-list"></div></div>
  <div id="main"><div id="content"></div></div>
</div>
<script>
const CUR=[
  {id:'s1',title:'기타와 친해지기',lessons:[
    {id:'s1l1',title:'클래식 기타란?',desc:'기타의 종류와 각 부위 명칭을 알아봅니다',
     explain:'<b>클래식 기타</b>는 나일론 줄을 사용하는 통기타로, 손가락으로 연주하는 악기입니다. 스틸줄 기타·통기타·전기기타와 구별됩니다.\n\n기타는 크게 <b>헤드(head)</b> — 줄을 감는 부분, <b>넥(neck)</b> — 손으로 잡는 긴 부분, <b>바디(body)</b> — 소리통 세 부분으로 이루어져 있습니다.\n\n클래식 기타는 성당, 독주회, 앙상블 등 다양한 자리에서 연주하며, 부드럽고 따뜻한 음색이 특징입니다.',
     points:['나일론 줄 → 손가락이 덜 아프고 부드러운 소리','픽 없이 손가락(p i m a)으로만 연주','발받침(footstool)을 사용해 기타를 안정적으로 잡음','클래식·종교음악·팝까지 다양한 레퍼토리'],
     score:null,scoreCaption:'',
     videos:[{title:'클래식 기타 완전 기초 — 악기 소개',channel:'기타 마스터 TV',url:'https://www.youtube.com/results?search_query=클래식+기타+입문+악기+소개',dur:'8분'},{title:'클래식 기타 vs 통기타 차이점',channel:'기타 레슨 코리아',url:'https://www.youtube.com/results?search_query=클래식+기타+통기타+차이',dur:'6분'}],
     practice:['기타를 무릎에 올리고 각 부위를 직접 손으로 짚어보며 이름 외우기','헤드 — 넥 — 바디 — 사운드홀을 손으로 따라가며 3번 반복','오늘은 악기를 친숙하게 느끼는 것이 목표!']},
    {id:'s1l2',title:'줄 이름 외우기',desc:'6개 줄의 이름과 번호를 완벽히 암기합니다',
     explain:'기타에는 <b>6개의 줄</b>이 있습니다. 연주자 입장에서 <b>아래쪽(가장 두꺼운 줄)</b>이 6번줄, <b>위쪽(가장 얇은 줄)</b>이 1번줄입니다.\n\n암기법: <b>"Eddie Ate Dynamite Good Bye Eddie"</b>\n6번 E — 5번 A — 4번 D — 3번 G — 2번 B — 1번 e',
     points:['6번줄 E (가장 두껍고 낮은 소리)','5번줄 A','4번줄 D','3번줄 G','2번줄 B','1번줄 e (가장 얇고 높은 소리)'],
     score:'6번줄 ──────── E (Mi, 미)\n5번줄 ──────── A (La, 라)\n4번줄 ──────── D (Re, 레)\n3번줄 ──────── G (Sol, 솔)\n2번줄 ──────── B (Si, 시)\n1번줄 ──────── e (Mi, 미)',
     scoreCaption:'개방현(프렛을 누르지 않은) 음이름',
     videos:[{title:'기타 6줄 이름 10분 만에 외우기',channel:'기타 배우기 채널',url:'https://www.youtube.com/results?search_query=기타+줄+이름+외우기',dur:'10분'},{title:'기타 튜닝 + 줄 이름 동시에 외우기',channel:'초보 기타 강의',url:'https://www.youtube.com/results?search_query=기타+튜닝+줄이름',dur:'7분'}],
     practice:['눈 감고 6번줄부터 1번줄까지 이름 말하기 (E A D G B e)','반대로 1번줄부터 6번줄까지도 말하기 (e B G D A E)','각 줄을 퉁기며 소리 차이 느껴보기','매일 아침 일어나자마자 3번씩 외우기!']},
    {id:'s1l3',title:'기타 튜닝하기',desc:'스마트폰 튜너 앱으로 정확하게 튜닝하는 법',
     explain:'<b>튜닝(tuning)</b>이란 기타 줄의 음높이를 정확히 맞추는 것입니다. 가장 쉬운 방법은 스마트폰 <b>튜너 앱</b>을 사용하는 것입니다. "GuitarTuna", "Pano Tuner" 등 무료 앱을 추천합니다.\n\n페그(헤드의 조율 나사)를 <b>조이면 음이 높아지고</b>, <b>풀면 낮아집니다</b>. 항상 낮은 음에서 올려서 맞추는 습관을 들이세요.',
     points:['튜닝은 연주 전 매번 반드시 확인','페그를 조금씩 돌리며 천천히 맞추기','항상 음을 낮은 쪽에서 올리며 맞추기 (줄 끊김 방지)','튜너 바늘이 정중앙 초록색에 오면 완료'],
     score:null,scoreCaption:'',
     videos:[{title:'기타 튜닝 완벽 가이드 — 튜너 앱 사용법',channel:'기타 마스터 TV',url:'https://www.youtube.com/results?search_query=기타+튜닝+방법+튜너앱',dur:'9분'},{title:'GuitarTuna 앱으로 3분 만에 튜닝',channel:'기타 입문 강의',url:'https://www.youtube.com/results?search_query=GuitarTuna+기타+튜닝',dur:'3분'}],
     practice:['스마트폰에 무료 튜너 앱 설치하기 (GuitarTuna 추천)','6번줄부터 1번줄까지 순서대로 튜닝 맞추기','튜닝 후 개방현 6줄을 모두 한 번씩 퉁겨서 소리 확인','연습 시작 전 매번 튜닝하는 습관 만들기']},
    {id:'s1l4',title:'손톱 관리',desc:'클래식 기타를 위한 손톱 길이와 관리법',
     explain:'클래식 기타에서 손톱은 매우 중요합니다. <b>왼손</b>은 최대한 짧게, <b>오른손</b>은 손가락 끝보다 <b>1~2mm 정도</b> 길게 기릅니다.\n\n손톱 형태는 타원형으로 다듬고, 에머리 보드(사포 파일)로 거스러미 없이 매끄럽게 만들어야 좋은 소리가 납니다.',
     points:['왼손: 손톱이 보이면 안 됨 — 매우 짧게','오른손 p i m a: 끝보다 1~2mm 길게','손톱 파일로 타원형으로 매끄럽게 다듬기','손톱이 없거나 약하면 인조 손톱(네일팁) 사용 가능'],
     score:null,scoreCaption:'',
     videos:[{title:'클래식 기타 손톱 기르고 관리하는 방법',channel:'기타 마스터 TV',url:'https://www.youtube.com/results?search_query=클래식+기타+손톱+관리',dur:'7분'},{title:'기타 손톱 파일링 — 좋은 소리 내는 법',channel:'클래식 기타 코리아',url:'https://www.youtube.com/results?search_query=기타+손톱+파일링+음색',dur:'5분'}],
     practice:['왼손 손톱을 손가락 끝과 평평하게 짧게 잘라보기','오른손 손톱 현재 상태 확인 — 너무 짧으면 기르기 시작','네일 파일로 오른손 손톱 끝을 매끄럽게 다듬기','손에 핸드크림을 발라 피부와 손톱 건강 유지']}
  ]},
  {id:'s2',title:'올바른 자세',lessons:[
    {id:'s2l1',title:'앉는 자세와 발받침',desc:'클래식 기타의 기본 연주 자세를 익힙니다',
     explain:'클래식 기타의 올바른 자세는 부상 예방과 좋은 음색 모두에 중요합니다.\n\n의자에 <b>등받이 없이 앞쪽</b>에 앉아 허리를 곧게 폅니다. <b>발받침(footstool)</b>을 왼발 밑에 놓아 왼 무릎 높이를 올립니다. 기타의 <b>허리 잘록한 부분(웨이스트)</b>을 왼 무릎에 올립니다.\n\n기타는 몸쪽으로 약간 기울여 넥은 <b>약 45도 각도</b>로 위를 향합니다.',

     practice:['C 코드 잡고 각 줄 하나씩 퉁겨 소리 확인','C → G → C → G 전환 연습 — 천천히!','Am → C → G → Em 4코드 진행 루프 연습']}
  ]},
  {id:'s6',title:'아르페지오와 첫 번째 곡',lessons:[
    {id:'s6l1',title:'아르페지오 기초 패턴',desc:'화음을 분산해서 연주하는 아르페지오를 배웁니다',
     explain:'<b>아르페지오(Arpeggio)</b>는 코드의 음을 동시에 치지 않고 <b>한 음씩 순서대로</b> 연주하는 주법입니다. 클래식 기타 특유의 서정적인 소리를 낼 수 있습니다.\n\n기본 패턴은 <b>p → i → m → a</b> 순서로 연주합니다. 처음에는 Am 코드나 Em 코드를 잡고 천천히 연습하세요.',
     points:['p = 저음줄(베이스), i = 3번줄, m = 2번줄, a = 1번줄','기본 패턴: p-i-m-a (4음 아르페지오)','코드를 유지한 채로 손가락만 이동','메트로놈에 맞춰 균일한 박자 유지가 핵심'],
     score:'4/4박자 기본 아르페지오:\n\n박자:    1    2    3    4\n손가락:  p    i    m    a\n\n줄:    4번  3번  2번  1번\n\nAm코드로 연습:\np(A줄) → i(G줄) → m(B줄) → a(e줄)\n───────────────────────────────\n연장 패턴 (6음): p-i-m-a-m-i',
     scoreCaption:'처음엔 p-i-m-a 4음부터, 익숙해지면 p-i-m-a-m-i 6음으로',
     videos:[{title:'아르페지오 기초 — 클래식 기타 필수',channel:'클래식 기타 코리아',url:'https://www.youtube.com/results?search_query=아르페지오+기초+클래식+기타',dur:'13분'},{title:'p-i-m-a 아르페지오 패턴 완전 정복',channel:'기타 마스터 TV',url:'https://www.youtube.com/results?search_query=pima+아르페지오+기타+패턴',dur:'10분'}],
     practice:['Am 코드 잡고 p-i-m-a 천천히 1분간 반복','메트로놈 40bpm → 익숙해지면 60bpm으로','Em → Am 코드 바꾸면서 아르페지오 유지']},
    {id:'s6l2',title:'첫 번째 곡 — 스페인 로망스',desc:'가장 유명한 클래식 기타 소품으로 첫 곡 도전',
     explain:'<b>스페인 로망스(Romance Anónimo)</b>는 클래식 기타의 대표적인 입문 곡입니다. 아름다운 멜로디와 함께 아르페지오를 실제 곡에 적용할 수 있습니다.\n\nEm 코드를 기반으로 한 아르페지오 반주 위에 멜로디가 얹히는 구조입니다. 처음에는 <b>전반부 8마디만</b> 배우고, 천천히 전체로 확장합니다.',
     points:['Em 코드 아르페지오가 기본 반주','멜로디는 1번줄에서 손가락으로 연주','처음 8마디만 완벽하게 → 전체로 확장','빠르게 치려 하지 말고 천천히 정확하게'],
     score:'스페인 로망스 첫 4마디 (간략 표기):\n\n멜로디 (1번줄 프렛번호):\ne: 0 ─ 0 ─ 1 ─ 0 ─ (미·미·파·미)\n\n아르페지오 반주 (Em):\np: 6번줄(E 개방)\ni: 3번줄(G 개방)\nm: 2번줄(B 개방)\na: 1번줄(e) + 멜로디\n\n※ 실제 악보 이미지는 선생님께 받으세요',
     scoreCaption:'악보 이미지를 이 자리에 추가하면 더 정확하게 배울 수 있습니다',
     videos:[{title:'스페인 로망스 기타 초보 강의',channel:'클래식 기타 코리아',url:'https://www.youtube.com/results?search_query=스페인+로망스+기타+초보+강의',dur:'18분'},{title:'Romance Anónimo 완성 연주 영상',channel:'클래식 기타 연주',url:'https://www.youtube.com/results?search_query=Romance+Anonimo+classical+guitar+tutorial',dur:'5분'}],
     practice:['먼저 Em 아르페지오만 4마디 메트로놈 50bpm 연습','멜로디 음만 별도로 반복 연습','반주 + 멜로디 합쳐서 첫 2마디만 천천히','완성 연주 영상 보며 목표 소리 귀에 익히기']}
  ]}
];

// 인덱스 부착
CUR.forEach((s,si)=>s.lessons.forEach((l,li)=>{l._si=si;l._li=li;l._stageTitle=s.title;}));

let done=new Set(JSON.parse(localStorage.getItem('kg_done')||'[]'));
let cur=null;
let openS=new Set(['s1']);

function saveDone(){localStorage.setItem('kg_done',JSON.stringify([...done]));}

function renderSidebar(){
  const el=document.getElementById('stage-list');
  el.innerHTML=CUR.map((s,si)=>{
    const dc=s.lessons.filter(l=>done.has(l.id)).length;
    const isOpen=openS.has(s.id);
    return`<div class="sidebar-section">
      <div class="stage-header${isOpen?' open':''}" onclick="toggleS('${s.id}')">
        <div class="stage-badge">${si+1}</div>
        <div class="stage-name">${s.title}<br><span style="font-size:10px;color:var(--text3);font-weight:400">${dc}/${s.lessons.length} 완료</span></div>
        <div class="stage-arrow">▶</div>
      </div>
      <div class="lesson-list${isOpen?' open':''}">
        ${s.lessons.map(l=>{
          const isDone=done.has(l.id);
          const isAct=cur&&cur.id===l.id;
          return`<div class="lesson-item${isAct?' active':''}${isDone?' done':''}" onclick="selLesson('${s.id}','${l.id}')">
            <div class="lesson-dot"></div>
            <div class="lesson-item-text">${l.title}</div>
            ${isDone?'<div class="done-check">✓</div>':''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  const total=CUR.reduce((a,s)=>a+s.lessons.length,0);
  document.getElementById('ppill').textContent=`진도: ${done.size} / ${total} 레슨`;
}

function toggleS(id){openS.has(id)?openS.delete(id):openS.add(id);renderSidebar();}

function selLesson(sid,lid){
  const s=CUR.find(x=>x.id===sid);
  const l=s.lessons.find(x=>x.id===lid);
  cur=l;
  renderSidebar();
  renderLesson(l,s);
  document.getElementById('main').scrollTop=0;
}

function renderLesson(l,s){
  s=s||CUR[l._si];
  const isDone=done.has(l.id);
  // 다음 레슨
  let nSid=null,nLid=null;
  if(l._li+1<s.lessons.length){nSid=s.id;nLid=s.lessons[l._li+1].id;}
  else if(l._si+1<CUR.length){nSid=CUR[l._si+1].id;nLid=CUR[l._si+1].lessons[0].id;}

  document.getElementById('content').innerHTML=`
  <div class="lesson-card">
    <div class="lesson-card-header">
      <div class="lesson-card-stage">${l._si+1}단계 · ${l._stageTitle}</div>
      <div class="lesson-card-title">${l.title}</div>
      <div class="lesson-card-desc">${l.desc}</div>
    </div>
    <div class="lesson-card-body">

      <div class="section-block">
        <div class="section-label"><div class="sicon si-blue">📖</div>설명</div>
        <div class="explain-text">${l.explain.replace(/\n/g,'<br>')}</div>
      </div>

      <div class="section-block">
        <div class="section-label"><div class="sicon si-gold">✨</div>핵심 포인트</div>
        <div class="point-list">
          ${l.points.map((p,i)=>`<div class="point-item"><div class="point-num">${i+1}</div><div class="point-text">${p}</div></div>`).join('')}
        </div>
      </div>

      <div class="section-block">
        <div class="section-label"><div class="sicon si-green">🎼</div>악보 &amp; 다이어그램</div>
        <div class="score-area"><div class="score-area-inner">
          ${l.score
            ?`<div class="score-ascii">${l.score}</div>${l.scoreCaption?`<div class="score-caption">${l.scoreCaption}</div>`:''}`
            :`<div class="score-img-slot">
                <div id="imgslot_${l.id}">
                  <div class="score-placeholder">
                    <div style="font-size:32px">🎼</div>
                    <span>악보 이미지를 여기에 추가할 수 있습니다</span>
                    <span style="font-size:10px;opacity:.7">이미지 URL을 데이터에 넣으면 자동으로 표시됩니다</span>
                  </div>
                </div>
              </div>
              ${l.scoreCaption?`<div class="score-caption">${l.scoreCaption}</div>`:''}`
          }
        </div></div>
      </div>

      <div class="section-block">
        <div class="section-label"><div class="sicon si-red">▶️</div>추천 유튜브 강좌</div>
        <div class="video-list">
          ${l.videos.map(v=>`
            <div class="video-item" onclick="window.open('${v.url}','_blank')">
              <div class="video-thumb">▶</div>
              <div class="video-info">
                <div class="video-title">${v.title}</div>
                <div class="video-channel">${v.channel}</div>
              </div>
              <div class="video-badge">${v.dur}</div>
            </div>`).join('')}
        </div>
      </div>

      <div class="section-block">
        <div class="section-label"><div class="sicon si-gray">🎸</div>오늘의 연습</div>
        <div class="practice-box"><div class="practice-steps">
          ${l.practice.map((p,i)=>`<div class="practice-step"><div class="step-icon">${['①','②','③','④'][i]||'•'}</div><div>${p}</div></div>`).join('')}
        </div></div>
      </div>

    </div>
    <div class="lesson-footer">
      <button class="btn-done${isDone?' done':''}" onclick="markDone('${l.id}')" ${isDone?'disabled':''}>
        ${isDone?'✓ 완료됨':'✓ 레슨 완료'}
      </button>
      ${nSid?`<button class="btn-next" onclick="selLesson('${nSid}','${nLid}')">다음 레슨 →</button>`:`<div style="font-size:13px;color:var(--green);font-weight:500">🎉 전체 커리큘럼 완료!</div>`}
    </div>
  </div>`;
}

function markDone(id){
  done.add(id);saveDone();renderSidebar();
  if(cur&&cur.id===id)renderLesson(cur);
}

// 환영 화면
function renderWelcome(){
  document.getElementById('content').innerHTML=`
  <div id="welcome">
    <div class="welcome-icon">🎸</div>
    <div class="welcome-title">교하성당 클래식기타반</div>
    <p class="welcome-sub">왼쪽 메뉴에서 단계를 선택해 레슨을 시작하세요.<br>기초부터 차근차근, 첫 번째 곡 연주까지 함께해요.</p>
    <div class="welcome-cards">
      ${CUR.map((s,i)=>`<div class="welcome-card"><div class="wc-num">${i+1}단계</div><div class="wc-title">${s.title}</div><div class="wc-desc">${s.lessons.length}개 레슨</div></div>`).join('')}
    </div>
    <button class="btn-start" onclick="selLesson('s1','s1l1')">첫 번째 레슨 시작하기 →</button>
  </div>`;
}

renderSidebar();
renderWelcome();
</script>
</body>
</html>
